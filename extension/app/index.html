<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' blob: data: https://api.groq.com https://generativelanguage.googleapis.com">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F2EF">
<title>كيكـ KEEK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#111111;--primary-hover:#2B2B2B;--on-primary:#FFFFFF;--accent:#476D3A;
  --leaf:#B7E57D;--lime:#BCDA61;--mist:#F4F4F2;
  --bg:#FAFAFA;--surface:#FFFFFF;--surface-2:#F7F7F7;
  --text:#111111;--text-2:#666666;--border:#E6E6E6;
  --danger:#C8372D;--warning:#B7791F;--warning-bg:#FBF3E2;--danger-bg:#FBEAE8;
  --hl:#EEF3E2;
  --shadow:0 12px 32px rgba(0,0,0,.12);
  --font-en:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#F2F2F2;--primary-hover:#FFFFFF;--on-primary:#111111;--accent:#B7E57D;
    --leaf:#3F5A33;--lime:#8FA845;--mist:#141414;
    --bg:#0D0D0D;--surface:#161616;--surface-2:#1B1B1B;
    --text:#F2F2F2;--text-2:#A3A3A3;--border:#2A2A2A;
    --danger:#F0857A;--warning:#E8B45A;--warning-bg:#2E2614;--danger-bg:#2E1715;
    --hl:#23301C;--shadow:0 12px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --primary:#F2F2F2;--primary-hover:#FFFFFF;--on-primary:#111111;--accent:#B7E57D;
    --leaf:#3F5A33;--lime:#8FA845;--mist:#141414;
    --bg:#0D0D0D;--surface:#161616;--surface-2:#1B1B1B;
    --text:#F2F2F2;--text-2:#A3A3A3;--border:#2A2A2A;
    --danger:#F0857A;--warning:#E8B45A;--warning-bg:#2E2614;--danger-bg:#2E1715;
    --hl:#23301C;--shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:var(--font-en);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-family:var(--font-ar);line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.3;font-weight:600}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
.muted{color:var(--text-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--mist);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.brand b{font-family:var(--font-en);letter-spacing:.06em;font-size:15px}
.brand small{display:block;color:var(--text-2);font-size:11.5px;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text-2);text-align:start;font-size:14.5px}
.nav button:hover{background:color-mix(in srgb,var(--primary) 8%,transparent);color:var(--text)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav button[aria-current="page"]{box-shadow:inset -3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-inline-start:auto;font-size:12px;color:var(--text-2)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:16px}
.side-foot .row{display:flex;gap:6px}
.main{overflow-y:auto;min-width:0}
.page{max-width:1120px;margin:0 auto;padding:28px 32px 64px}
.topbar{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head p{color:var(--text-2);margin-top:4px}
.crumb{font-size:13px;color:var(--text-2);margin-bottom:6px}
.crumb button{border:0;background:none;color:var(--primary);cursor:pointer;padding:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:none;color:var(--text-2)}
.btn.ghost:hover{color:var(--text);background:color-mix(in srgb,var(--primary) 7%,transparent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.input,.select,textarea.input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:8px 12px;font-size:14.5px}
textarea.input{resize:vertical;min-height:110px;line-height:1.6}
.input:focus,.select:focus{outline:2px solid color-mix(in srgb,var(--primary) 50%,transparent);outline-offset:0;border-color:var(--primary)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-2)}
label.field>span{font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .input{max-width:320px}
.toolbar .select{width:auto}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:14.5px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--primary);font-weight:600}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);gap:12px}
.panel-body{padding:16px 18px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
.rows{list-style:none;margin:0;padding:0}
.rows>li{border-bottom:1px solid var(--border)}
.rows>li:last-child{border-bottom:0}
.row-btn{display:flex;gap:12px;align-items:center;width:100%;padding:12px 18px;border:0;background:none;cursor:pointer;text-align:start}
.row-btn:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{font-size:13px;color:var(--text-2)}
.row-pad{padding:12px 18px}

/* badges & chips */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);background:var(--surface);white-space:nowrap;line-height:1.6}
.badge.ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.badge.work{color:var(--text);background:color-mix(in srgb,var(--lime) 30%,var(--surface));border-color:transparent}
.badge.fail{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border));background:var(--danger-bg)}
.badge.warn{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 40%,var(--border));background:var(--warning-bg)}
.badge.sample{border-style:dashed}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.src{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--hl);color:var(--text);border:0;cursor:pointer;vertical-align:baseline;margin-inline:2px;line-height:1.7;font-family:inherit}
.src:hover{outline:1px solid var(--primary)}
.src svg{width:11px;height:11px}
.suggest{background:var(--mist);border-radius:8px;padding:12px 14px;border-inline-start:3px solid var(--lime)}
.suggest .lbl{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.unconf{outline:1px solid color-mix(in srgb,var(--warning) 60%,transparent);outline-offset:-1px}

/* items */
.item{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);align-items:flex-start}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .title{font-weight:600}
.item .desc{color:var(--text-2);font-size:14px;margin-top:2px}
.item .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--text-2);background:none;cursor:pointer;flex:none;margin-top:2px;display:grid;place-items:center;padding:0}
.check[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.check svg{width:13px;height:13px}
.done .title{text-decoration:line-through;color:var(--text-2)}
[contenteditable]{outline:none;border-radius:4px}
[contenteditable]:hover{background:color-mix(in srgb,var(--primary) 5%,transparent)}
[contenteditable]:focus{background:color-mix(in srgb,var(--primary) 8%,transparent)}

/* transcript */
.seg-row{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border)}
.seg-row.hit{background:var(--hl)}
.seg-row .ts{font-size:12.5px;color:var(--text-2);padding-top:3px;font-variant-numeric:tabular-nums}
.seg-row .spk{font-size:12.5px;font-weight:600;color:var(--accent);margin-bottom:2px}
.seg-row .txt{white-space:pre-wrap}
mark{background:color-mix(in srgb,var(--lime) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* stats strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:20px}
.strip>div{padding:14px 18px;border-inline-end:1px solid var(--border)}
.strip>div:last-child{border-inline-end:0}
.strip b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.strip span{font-size:13px;color:var(--text-2)}

/* hero (overview) */
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.rec-cta{background:var(--primary);color:var(--on-primary);border:0;border-radius:999px;padding:12px 22px 12px 16px;display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;font-size:15px}
html[dir="rtl"] .rec-cta{padding:12px 16px 12px 22px}
.rec-cta .ring{width:18px;height:18px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--on-primary) 30%,transparent)}

/* recording */
.recorder{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px 20px;overflow:hidden;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.glow{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.glow svg{width:340px;height:340px;filter:blur(28px);opacity:.55;transition:transform .12s linear}
.timer{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;position:relative;font-family:var(--font-en)}
.rec-state{position:relative;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2)}
.rec-state .dot{color:var(--danger)}
.rec-state.live .dot{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.meter{position:relative;display:flex;gap:3px;align-items:center;height:36px}
.meter i{width:4px;border-radius:2px;background:var(--primary);height:4px;transition:height .08s}
.rec-controls{position:relative;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.live-text{position:relative;width:100%;max-width:680px;max-height:220px;overflow-y:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:14.5px}
.live-text .interim{color:var(--text-2)}

/* chat */
.chat{display:grid;grid-template-columns:240px 1fr;gap:20px;height:calc(100vh - 150px);min-height:480px}
.chat-list{overflow-y:auto}
.chat-main{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px}
.msg.user{align-self:flex-end;max-width:80%;background:var(--mist);padding:10px 14px;border-radius:10px}
.msg.ai{max-width:92%}
.msg.ai .who{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.msg.ai .who img{width:18px;height:18px;border-radius:5px}
.md p{margin:0 0 10px}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 10px;padding-inline-start:22px}
.md h1{font-size:22px;margin:4px 0 12px}.md h2{font-size:18px;margin:18px 0 8px}.md h3{font-size:15.5px;margin:14px 0 6px}
.followups{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.composer{border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px}
.composer .bar{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:160px}
.scope{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text-2)}
.prompts{display:flex;flex-wrap:wrap;gap:8px}
.prompts button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--text)}
.prompts button:hover{border-color:var(--primary)}
.thinking{color:var(--text-2);font-size:14px;display:flex;gap:6px;align-items:center}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}

/* editor */
.editor{min-height:420px;padding:28px 36px;line-height:1.8;font-size:15.5px}
.editor h1{font-size:24px;margin:0 0 14px}.editor h2{font-size:19px;margin:22px 0 8px}.editor h3{font-size:16px;margin:16px 0 6px}
.editor p{margin:0 0 12px}
.editor ul,.editor ol{padding-inline-start:24px;margin:0 0 12px}
.editor:hover{background:none}
.editor:focus{background:none}

/* empty / setup */
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .mark{width:56px;height:56px;border-radius:14px;opacity:.9}
.empty p{color:var(--text-2);max-width:420px}
.setup{display:flex;gap:12px;align-items:flex-start;background:var(--warning-bg);border:1px solid color-mix(in srgb,var(--warning) 35%,var(--border));border-radius:10px;padding:14px 16px;font-size:14px}
.setup b{display:block;margin-bottom:2px}
.note{background:var(--surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--text-2)}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--border),var(--surface-2),var(--border));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:6px;height:12px;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(17,22,15,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(640px,100%);max-height:90vh;overflow-y:auto}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:14px;max-width:360px}
.drop{border:1.5px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop:hover{border-color:var(--primary)}

/* onboarding */
.onb{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--bg)}
.onb-card{width:min(520px,100%);display:flex;flex-direction:column;gap:20px}
.onb-logo{width:96px;height:96px;border-radius:22px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:14px;text-align:start;cursor:pointer}
.choice button[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.choice b{display:block;margin-bottom:2px}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--border)}
.steps i.on{background:var(--primary)}

.person{display:inline-flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--mist);color:var(--text);display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;border:1px solid var(--border)}
.hidden{display:none!important}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  html[dir="rtl"] .side{transform:translateX(105%)}
  .side.open,html[dir="rtl"] .side.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--mist);position:sticky;top:0;z-index:30}
  .topbar img{width:30px;height:30px;border-radius:8px}
  .page{padding:20px 16px 56px}
  .cols,.grid2{grid-template-columns:1fr}
  .strip{grid-template-columns:1fr 1fr}
  .strip>div:nth-child(2){border-inline-end:0}
  .strip>div:nth-child(-n+2){border-bottom:1px solid var(--border)}
  .chat{grid-template-columns:1fr;height:auto}
  .chat-list{max-height:180px}
  .msgs{min-height:320px;max-height:60vh}
  .editor{padding:18px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.row-title,.row-meta{display:block}
.row-title,.row-meta,.item .title,.item .desc,.seg-row .txt,.msg.user,.md li,.md p,.live-text div,.note{unicode-bidi:plaintext}
#root{height:100%}
/* granola-style notepad */
.note-wrap{max-width:820px;margin:0 auto;padding-bottom:24px}
.note-head{margin-bottom:18px}
.note-head h1{font-size:30px;margin-bottom:10px}
.note-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.select.chipin,.input.chipin{width:auto;max-width:220px;padding:3px 10px;font-size:13px;border-radius:999px;background:var(--surface)}
.input.chipin{min-width:140px}
.notepad{display:block;width:100%;min-height:52vh;border:0;background:transparent;font-size:17px;line-height:1.9;resize:vertical;outline:none;padding:4px 0 16px;color:var(--text);unicode-bidi:plaintext}
.notepad::placeholder{color:var(--text-2);opacity:.75}
.notes{font-size:16.5px;line-height:1.85}
.notes h3{font-size:17px;margin:22px 0 6px}
.notes ul{margin:0;padding-inline-start:22px}
.notes li{margin:3px 0;unicode-bidi:plaintext}
.notes li.u,.notes .u{color:var(--text)}
.notes li.a,.notes .a{color:var(--text-2)}
.notes .src{opacity:.75;font-size:11px}
.notes li:hover .src{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-top:22px;padding-top:12px;border-top:1px solid var(--border)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.sw.u{background:var(--text)}.sw.a{background:var(--text-2);opacity:.6}
.notebar{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;margin-top:28px;align-items:center;flex-wrap:wrap;z-index:5}
.recpill,.askpill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 8px;box-shadow:var(--shadow);min-height:46px}
.recpill{padding-inline-start:12px;max-width:100%}
.askpill{flex:1;min-width:220px;padding-inline-start:16px}
.askpill input{flex:1;border:0;background:none;outline:none;font-size:14.5px;min-width:0}
.recpill .rec-state{gap:0}
.meter.mini{height:18px;gap:2px}
.meter.mini i{width:3px;height:3px}
.cap{font-size:12.5px;color:var(--text-2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.rec-pill{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:8px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--danger) 35%,var(--border));background:var(--danger-bg);cursor:pointer;text-align:start;width:100%}
.rec-pill .dot{color:var(--danger);animation:blink 1.2s infinite;flex:none}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.askbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 6px 6px 18px;margin-bottom:28px}
html[dir="rtl"] .askbar{padding:6px 18px 6px 6px}
.askbar>svg{width:18px;height:18px;color:var(--primary);flex:none}
.askbar input{flex:1;border:0;background:none;outline:none;font-size:15.5px;padding:8px 0;min-width:0}
.day{font-size:13px;font-weight:600;color:var(--text-2);margin:0 4px 8px}
@media (max-width:900px){.note-head h1{font-size:24px}.notebar{bottom:calc(8px + env(safe-area-inset-bottom,0px))}.cap{display:none}}
.notes p,.notes h3,.note-head h1,.input.chipin{unicode-bidi:plaintext}
.notebar{background:var(--bg);padding:10px 0;margin-top:18px;border-top:1px solid transparent}
@media (max-width:900px){.notebar{gap:8px}.recpill{flex:1;justify-content:center}}

/* PRD build additions */
.pipeline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.pipeline span{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);background:var(--surface)}
.pipeline span.done{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.pipeline span.now{color:var(--text);background:color-mix(in srgb,var(--lime) 30%,var(--surface));border-color:transparent}
.pipeline span.skip{text-decoration:line-through;opacity:.6}
.pipeline span.fail{color:var(--danger);border-color:var(--danger)}
.player{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 10px;margin-bottom:8px}
.player audio{width:100%}
.seg-row .ts{cursor:pointer;border:0;background:none;text-align:start;padding:3px 0 0;font:inherit;font-size:12.5px;color:var(--text-2)}
.seg-row .ts:hover{color:var(--accent)}
.seg-row .lang{font-size:11px;color:var(--text-2);margin-inline-start:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .perm{font-size:12.5px;color:var(--text-2)}
.option{display:flex;gap:14px;align-items:flex-start;text-align:start;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:14px 16px;cursor:pointer;width:100%}
.option:hover:not([disabled]){border-color:var(--text-2)}
.option[disabled]{cursor:not-allowed;opacity:.7}
.option svg{width:22px;height:22px;flex:none;margin-top:2px}
.option b{display:block}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:start}
.tbl th{font-weight:600;color:var(--text-2);font-size:12.5px}
.tblwrap{overflow-x:auto}
.select.sm{padding:3px 8px;font-size:12.5px;width:auto;border-radius:6px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.answer{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:18px 20px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--border)}
.toggle:last-child{border-bottom:0}
.switch{width:38px;height:22px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);position:relative;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--text-2);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:18px;background:#fff}
.switch[disabled]{opacity:.45;cursor:not-allowed}
.consent{display:flex;gap:10px;align-items:flex-start;position:relative;max-width:560px;font-size:13.5px;text-align:start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
.person>svg,.card h3 svg{width:20px;height:20px;flex:none}.card h3 .person{gap:10px}

/* ================= App skin: laptop & iPad (same identity, native-app style) ================= */
:root{--bg:#F2F2EF;--fill:#E9E9E5;--fill-2:#F5F5F2;--sep:rgba(0,0,0,.09);--tint:var(--accent);--on-tint:#FFFFFF;--tint-soft:#E6EEDB;--r-lg:18px;--lift:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0B;--fill:#262626;--fill-2:#1D1D1D;--sep:rgba(255,255,255,.09);--on-tint:#10170C;--tint-soft:#22301A;--lift:none}}
:root[data-theme="dark"]{--bg:#0B0B0B;--fill:#262626;--fill-2:#1D1D1D;--sep:rgba(255,255,255,.09);--on-tint:#10170C;--tint-soft:#22301A;--lift:none}

.ic .d{fill:currentColor;fill-opacity:.16;stroke:none}
.ic .f{fill:currentColor;stroke:none}

/* sidebar */
.side{background:color-mix(in srgb,var(--surface) 70%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(22px);backdrop-filter:saturate(1.6) blur(22px);border-inline-end:1px solid var(--sep);padding:18px 12px}
.brand{padding:6px 10px 20px}
.brand img{width:38px;height:38px;border-radius:11px}
.nav button{border-radius:11px;padding:9px 12px;min-height:42px;font-size:15px;color:var(--text);gap:12px}
.nav button svg{width:21px;height:21px;color:var(--tint)}
.nav button:hover{background:var(--fill);color:var(--text)}
.nav button[aria-current="page"],html[dir="rtl"] .nav button[aria-current="page"]{background:var(--tint);color:var(--on-tint);box-shadow:none;font-weight:600}
.nav button[aria-current="page"] svg,.nav button[aria-current="page"] .count{color:var(--on-tint)}
.side-foot .btn{justify-content:flex-start}
.rec-pill{border:0;border-radius:12px}

/* page & large titles */
.page{max-width:1080px;padding:34px 40px 64px}
.page-head h1,.hero h1,.col-head h1,.note-head h1{font-size:32px;font-weight:700;letter-spacing:-.01em}
.page-head p{font-size:15px}
.crumb button{color:var(--tint);font-weight:600}

/* buttons: capsules, tinted text buttons */
.btn{border:0;border-radius:999px;background:var(--fill);padding:9px 16px;min-height:38px;font-weight:600}
.btn:hover{border:0;background:color-mix(in srgb,var(--fill) 85%,var(--text))}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:none;color:var(--tint)}
.btn.ghost:hover{background:var(--tint-soft);color:var(--tint)}
.btn.danger{background:var(--danger-bg);color:var(--danger);border:0}
.btn.sm{padding:6px 12px;min-height:32px}
.btn.icon{width:38px;height:38px;padding:0;min-height:0}
.btn.icon svg{width:20px;height:20px}
.rec-cta{box-shadow:var(--lift)}

/* fields: filled */
.input,.select,textarea.input{background:var(--fill);border:1px solid transparent;border-radius:12px;padding:10px 14px;min-height:42px}
.input:focus,.select:focus{background:var(--surface);border-color:var(--tint);outline:3px solid color-mix(in srgb,var(--tint) 22%,transparent)}
.input[disabled],.select[disabled]{opacity:.55}
.select.sm{min-height:30px;border-radius:9px;padding:3px 10px}
.searchfield{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;min-height:40px;margin-bottom:10px}
.searchfield input{border:0;background:none;outline:none;flex:1;font-size:15px;min-width:0;padding:8px 0}
.searchfield svg{width:17px;height:17px;color:var(--text-2);flex:none}
.askbar{border:0;border-radius:16px;background:var(--surface);box-shadow:var(--lift);padding:8px 8px 8px 18px}
html[dir="rtl"] .askbar{padding:8px 18px 8px 8px}
.askbar>svg{color:var(--tint)}

/* segmented controls (tabs + seg) */
.seg,.tabs{background:var(--fill);border:0;border-radius:12px;padding:3px;gap:2px;display:flex;width:fit-content;max-width:100%;overflow-x:auto}
.seg button,.tabs button{border:0;margin:0;border-radius:9px;padding:7px 15px;font-size:14px;color:var(--text);font-weight:500;white-space:nowrap;background:none}
.seg button[aria-pressed="true"],.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14);border:0}
.tabs{margin-bottom:22px}

/* inset grouped cards */
.panel{background:none;border:0;border-radius:0}
.panel>:not(.panel-head){background:var(--surface)}
.panel>.panel-head+*,.panel>:first-child:not(.panel-head){border-top-left-radius:var(--r-lg);border-top-right-radius:var(--r-lg)}
.panel>:last-child:not(.panel-head){border-bottom-left-radius:var(--r-lg);border-bottom-right-radius:var(--r-lg)}
.panel>ul.rows,.panel>.tblwrap{overflow:hidden}
.panel-head{border:0;padding:0 8px 8px}
.panel-head h3{font-size:13.5px;font-weight:600;color:var(--text-2)}
html[lang="en"] .panel-head h3,html[lang="en"] .day,html[lang="en"] .daylbl{text-transform:uppercase;font-size:12px;letter-spacing:.05em}
.panel-head .btn.ghost.sm{padding:2px 8px;min-height:0}
.rows>li,.item,.seg-row,.toggle,.tbl th,.tbl td{border-color:var(--sep)}
.row-btn{padding:11px 16px;min-height:58px;gap:14px}
.row-btn:hover,.cell:hover{background:var(--fill-2)}
.item{padding:14px 18px}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--tint-soft);color:var(--tint)}
.tile svg{width:20px;height:20px}
.chev{display:grid;color:var(--text-2);opacity:.55;flex:none}
.chev svg{width:16px;height:16px}
html[dir="rtl"] .chev svg{transform:scaleX(-1)}

/* widgets */
.strip{background:none;border:0;gap:12px;grid-template-columns:repeat(4,1fr)}
.strip>div,.strip>div:last-child,.strip>div:nth-child(2),.strip>div:nth-child(-n+2){background:var(--surface);border:0;border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--lift)}
.strip b{font-size:28px;font-weight:700}
.card{border:0;border-radius:20px;padding:18px;box-shadow:var(--lift)}
.card h3 .person>svg,.option>svg{width:42px;height:42px;padding:10px;border-radius:12px;background:var(--tint-soft);color:var(--tint);box-sizing:border-box;flex:none}
.answer{border:0;border-radius:var(--r-lg);box-shadow:var(--lift)}
.recorder{border:0;border-radius:24px;box-shadow:var(--lift)}

/* badges, chips, checks */
.badge{border:0;background:var(--fill);color:var(--text-2);font-weight:500;padding:3px 10px}
.badge.ok{background:var(--tint-soft);color:var(--tint);border:0}
.badge.warn{background:var(--warning-bg);color:var(--warning);border:0}
.badge.fail{background:var(--danger-bg);color:var(--danger);border:0}
.badge.sample{background:none;border:1px dashed var(--border)}
.tag{border:0;background:var(--fill);border-radius:999px;padding:2px 10px}
.src{border-radius:999px;background:var(--tint-soft);color:var(--tint);font-weight:600;padding:2px 9px}
.check{border-radius:50%;width:22px;height:22px;border:2px solid color-mix(in srgb,var(--text-2) 55%,transparent)}
.check[aria-checked="true"]{background:var(--tint);border-color:var(--tint);color:var(--on-tint)}
.pipeline span{border:0;background:var(--fill)}
.pipeline span.done{background:var(--tint-soft);color:var(--tint)}
.switch{width:46px;height:28px;border:0;background:var(--fill)}
.switch::after{top:2px;width:24px;height:24px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]::after{inset-inline-start:20px}
.note{border:0;background:var(--fill-2);border-radius:12px}
.setup{border:0;border-radius:14px}
.suggest{border-radius:14px}
.empty .mark{border-radius:16px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--fill);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.chipbtn svg{width:15px;height:15px}
.chipbtn.on{background:var(--tint);color:var(--on-tint)}
.filterbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.filters{display:grid;gap:8px;padding:6px 0 4px}

/* sheets & toasts */
.scrim{background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal{border-radius:22px}
.modal-head{border:0;justify-content:center;position:relative;padding:18px 56px 8px}
.modal-head h3{font-size:17px;text-align:center}
.modal-head .btn{position:absolute;top:12px;inset-inline-end:12px;background:var(--fill);color:var(--text-2);width:30px;height:30px;padding:0;min-height:0}
.modal-foot{border:0}
.option{border:0;background:var(--fill-2);border-radius:16px;padding:14px 16px;align-items:center}
.option:hover:not([disabled]){background:var(--fill)}
.toasts{left:50%;transform:translateX(-50%);inset-inline-end:auto;align-items:center}
.toast{border-radius:999px;padding:10px 18px}
.onb-card{background:var(--surface);padding:32px;border-radius:28px;box-shadow:var(--lift)}
.choice button{border:0;background:var(--fill-2);border-radius:16px}
.choice button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tint);border:0}

/* split view (Mail-style) */
.page-split{max-width:none;padding:0;height:100%}
.split{display:grid;grid-template-columns:minmax(300px,360px) 1fr;height:100%}
.split-list{border-inline-end:1px solid var(--sep);background:color-mix(in srgb,var(--surface) 50%,var(--bg));overflow-y:auto;padding:22px 12px 40px}
.split-detail{overflow-y:auto;padding:30px 36px 64px;min-width:0}
.detail-inner{max-width:980px;margin:0 auto}
.split-empty{display:grid;place-items:center}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 12px}
.col-head h1{font-size:28px}
.daylbl{font-size:13px;font-weight:600;color:var(--text-2);padding:14px 12px 6px}
.cell{display:block;width:100%;text-align:start;border:0;background:none;padding:11px 12px;border-radius:14px;cursor:pointer;margin-bottom:2px;color:var(--text)}
.cell[aria-current="true"],.cell[aria-current="true"]:hover{background:var(--tint);color:var(--on-tint)}
.cell-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cell-top b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.cell-top span,.cell-sub{font-size:12.5px;color:var(--text-2);flex:none}
.cell-prev{font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;unicode-bidi:plaintext}
.cell[aria-current="true"] .cell-top span,.cell[aria-current="true"] .cell-sub,.cell[aria-current="true"] .cell-prev{color:color-mix(in srgb,var(--on-tint) 78%,transparent)}
.cell-tags{display:flex;gap:6px;margin-top:6px}
.player{background:var(--bg)}
@media (min-width:1100px){.split .crumb{display:none}}

/* tab bar + sidebar sheet (phones) */
.tabbar{display:none;position:fixed;bottom:0;inset-inline:0;z-index:35;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(22px);backdrop-filter:saturate(1.6) blur(22px);border-top:1px solid var(--sep);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--text-2);padding:4px 0;cursor:pointer;font-weight:500}
.tabbar button svg{width:25px;height:25px}
.tabbar button[aria-current="page"]{color:var(--tint)}
.side-scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
.topbar{display:none!important}

/* iPad portrait & small laptops: icon rail, single column meetings */
@media (max-width:1099px){
  .page-split{padding:24px 28px 96px;height:auto;max-width:1080px;margin:0 auto}
  .split{display:block;height:auto}
  .split-list{border:0;background:none;padding:0;overflow:visible}
  .split-list.hide-narrow,.split-empty{display:none}
  .split-detail{padding:0;overflow:visible}
}
@media (min-width:760px) and (max-width:1099px){
  .app{grid-template-columns:88px 1fr;grid-template-rows:none}
  .side,html[dir="rtl"] .side{position:static;transform:none;width:auto;box-shadow:none;padding:16px 8px;align-items:center;inset:auto}
  .brand{padding:4px 0 14px;justify-content:center}.brand>div{display:none}
  .nav{width:100%}
  .nav button{flex-direction:column;gap:3px;padding:8px 2px;font-size:10.5px;justify-content:center;text-align:center;min-height:56px}
  .nav button svg{width:23px;height:23px}
  .nav .count,#saveState,.rec-pill .row-main{display:none}
  .rec-pill{justify-content:center;padding:10px}
  .side-foot{align-items:center}.side-foot .btn{font-size:0;gap:0;width:40px;height:40px;padding:0;justify-content:center}.side-foot .btn svg{width:20px;height:20px}
  .page{padding:28px 28px 64px}
  .cols{grid-template-columns:1fr}
}
@media (max-width:759px){
  .app{grid-template-columns:1fr;grid-template-rows:none}
  .tabbar{display:flex}
  .page,.page-split{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .strip{grid-template-columns:1fr 1fr}
  .page-head h1,.hero h1,.col-head h1{font-size:28px}
  .scrim{place-items:end center;padding:0}
  .modal{border-radius:22px 22px 0 0;width:100%;max-height:90vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .side{z-index:40}
}
.unconf{outline:0;box-shadow:inset 3px 0 0 var(--warning)}
html[dir="rtl"] .unconf{box-shadow:inset -3px 0 0 var(--warning)}

</style>
</head>

<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="keek-nlp.js"></script>
<script src="platform.js"></script>
<script src="keekx.js"></script>
<script src="app.js"></script>
</body>
</html>
